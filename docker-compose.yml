services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8000:8000"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
  mqtt-recorder:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    depends_on:
      - mqtt
    user: "1000:1000"
    volumes:
      - ./recordings:/recordings
    command:
      - sh
      - -c
      - >-
        exec mosquitto_sub -h mqtt -p 1883 -V 5 -q 2 --retain-as-published
        -t '#' -F '%U\t%t\t%q\t%r\t%x'
        > "/recordings/$$(date -u +%Y%m%dT%H%M%SZ).tsv"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  mosquitto-data:
