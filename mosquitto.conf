listener 1883
allow_anonymous true

listener 8000
protocol websockets
allow_anonymous true

# Keep retained messages (firmware ELF, calibration, checklist state) across broker restarts.
# The database is written on shutdown and every autosave_interval seconds while running.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# The test-stand frontend shares the matching firmware ELF through MQTT retained state.
# Mosquitto 2.1+ defaults max_packet_size to 2,000,000 bytes, which is too small for a ~12 MB ELF.
max_packet_size 20000000

# Never drop messages for a subscriber that reads more slowly than they arrive; hold them in
# memory until it catches up. The default limit of 1000 queued messages silently loses
# telemetry for a frontend that stalls for a few seconds, and loses most of a fast replay.
# A client that stops reading altogether is disconnected by its keep-alive timeout.
max_queued_messages 0

# scripts/replay-mqtt.sh opens one connection per replayed message; do not log each of them.
connection_messages false
